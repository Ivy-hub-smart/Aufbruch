<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #3a4b63; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      /* Gegenwind am Ufer: Sturmwolken, Wellen, dann bricht die Sonne durch */
      #storm { background: linear-gradient(180deg, #2c3a50 0%, #56677f 45%, #8a97a8 66%); }
      #clear { opacity: 0; background: linear-gradient(180deg, #3c8fd8 0%, #8cc8f0 45%, #ffe1a6 66%); }
      #sun {
        position: absolute; left: 760px; top: 520px; width: 240px; height: 240px; margin: -120px 0 0 -120px; border-radius: 50%;
        background: radial-gradient(circle, #fffbe6 0%, #ffe28a 60%, #ffc24d 100%);
        box-shadow: 0 0 160px 80px rgba(255,224,140,0.7);
      }
      #rays {
        position: absolute; left: 760px; top: 520px; width: 2600px; height: 2600px; margin: -1300px 0 0 -1300px;
        background: repeating-conic-gradient(rgba(255,240,190,0.25) 0deg 6deg, transparent 6deg 18deg);
        -webkit-mask: radial-gradient(circle, #000 0%, transparent 60%); mask: radial-gradient(circle, #000 0%, transparent 60%);
      }
      .cloud { position: absolute; }
      .cloud i { position: absolute; border-radius: 50%; background: #3e4d63; }
      #ridge { position: absolute; left: 0; top: 1040px; width: 4320px; height: 200px; }
      #lake { position: absolute; left: 0; right: 0; top: 1200px; bottom: 0; background: linear-gradient(180deg, #4f6f8a, #2b4560); }
      .wave { position: absolute; left: 0; width: 4320px; height: 40px; }
      #rocks { position: absolute; left: 0; bottom: 0; width: 4320px; height: 260px; }
      .streak {
        position: absolute; height: 5px; border-radius: 5px;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(235,245,255,0.8), rgba(255,255,255,0));
      }
      .leaf { position: absolute; width: 30px; height: 16px; border-radius: 0 100% 0 100%; }
      .drop { position: absolute; width: 4px; height: 50px; border-radius: 4px; background: rgba(220,235,255,0.6); }
      #me {
        position: absolute; left: 50%; bottom: -30px; width: 900px; height: 980px; margin-left: -450px;
        background: url("assets/ich.png") center bottom / contain no-repeat;
        transform-origin: 50% 100%;
      }
      #flash { background: #fff8dc; opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="storm" class="clip layer" data-start="0" data-duration="10" data-track-index="0"></div>
      <div id="clear" class="clip layer" data-start="0" data-duration="10" data-track-index="1"></div>
      <div id="shore" class="clip layer" data-start="0" data-duration="10" data-track-index="2"></div>
      <div id="me" class="clip" data-start="0" data-duration="10" data-track-index="3"></div>
      <div id="wind" class="clip layer" data-start="0" data-duration="10" data-track-index="4"></div>
      <div id="flash" class="clip layer" data-start="0" data-duration="10" data-track-index="5"></div>
    </div>
    <script>
      let seed = 3131;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      document.getElementById("clear").innerHTML = '<div id="rays"></div><div id="sun"></div>';

      // dunkle Sturmwolken
      const storm = document.getElementById("storm");
      const clouds = [];
      for (let i = 0; i < 9; i++) {
        const c = document.createElement("div");
        c.className = "cloud";
        c.style.left = -200 + rand() * 1400 + "px";
        c.style.top = 60 + rand() * 820 + "px";
        const s = 0.9 + rand() * 1.1;
        c.style.transform = `scale(${s})`;
        c.innerHTML = '<i style="left:0;top:40px;width:180px;height:110px"></i><i style="left:80px;top:0;width:170px;height:150px"></i><i style="left:190px;top:30px;width:170px;height:120px"></i><i style="left:40px;top:80px;width:290px;height:90px"></i>';
        c.style.opacity = 0.7 + rand() * 0.3;
        storm.appendChild(c);
        clouds.push(c);
      }

      // Berge, See mit Wellen, Steine am Ufer
      const shore = document.getElementById("shore");
      let r = "M0 200";
      for (let x = 0; x <= 4320; x += 240) r += ` L${x + 120} ${30 + rand() * 90} L${x + 240} ${110 + rand() * 50}`;
      let waves = "";
      for (let i = 0; i < 14; i++) {
        let w = "M0 20";
        for (let x = 0; x < 4320; x += 80) w += ` q20 -16 40 0 q20 16 40 0`;
        waves += `<svg class="wave" style="top:${1210 + i * 50}px" viewBox="0 0 4320 40" preserveAspectRatio="none"><path d="${w}" stroke="rgba(230,240,255,${0.25 + i * 0.03})" stroke-width="${3 + i * 0.4}" fill="none"/></svg>`;
      }
      let rocks = "";
      for (let x = 0; x < 4320; x += 140 + rand() * 120) {
        const w = 120 + rand() * 160, h = 70 + rand() * 120;
        rocks += `<ellipse cx="${x}" cy="${260 - h / 3}" rx="${w / 2}" ry="${h / 2}" fill="${rand() > 0.5 ? "#5b5f66" : "#6e737b"}"/>`;
      }
      shore.innerHTML =
        `<svg id="ridge" viewBox="0 0 4320 200" preserveAspectRatio="none"><path d="${r} L4320 200 Z" fill="#3b4a5e"/></svg>` +
        '<div id="lake"></div>' + waves +
        `<svg id="rocks" viewBox="0 0 4320 260" preserveAspectRatio="none"><rect x="0" y="200" width="4320" height="60" fill="#4a4e55"/>${rocks}</svg>`;

      // Wind: Linien, Blätter, Sprühregen
      const wind = document.getElementById("wind");
      const streaks = [], leaves = [], drops = [];
      for (let i = 0; i < 26; i++) {
        const s = document.createElement("div");
        s.className = "streak";
        s.style.top = 60 + rand() * 1780 + "px";
        s.style.width = 220 + rand() * 400 + "px";
        s.style.left = "1100px";
        wind.appendChild(s);
        streaks.push(s);
      }
      for (let i = 0; i < 18; i++) {
        const l = document.createElement("div");
        l.className = "leaf";
        l.style.background = ["#d98a2b", "#b8541f", "#e3b23c"][i % 3];
        l.style.top = 200 + rand() * 1500 + "px";
        l.style.left = "1120px";
        wind.appendChild(l);
        leaves.push(l);
      }
      for (let i = 0; i < 60; i++) {
        const d = document.createElement("div");
        d.className = "drop";
        d.style.left = rand() * 1300 + "px";
        d.style.top = -80 + "px";
        wind.appendChild(d);
        drops.push(d);
      }

      const D = 10;
      const TURN = 5; // Sonne bricht durch
      const tl = gsap.timeline({ paused: true });

      clouds.forEach((c, i) => tl.fromTo(c, { x: 0 }, { x: -700 - (i % 3) * 300, duration: D, ease: "none" }, 0));
      tl.fromTo("#ridge", { x: 0 }, { x: -300, duration: D, ease: "none" }, 0);
      tl.fromTo(".wave", { x: 0 }, { x: -1600, duration: D, ease: "none" }, 0);
      tl.fromTo(".wave", { y: -6 }, { y: 6, duration: 0.6, yoyo: true, repeat: 15, ease: "sine.inOut" }, 0);
      tl.fromTo("#rocks", { x: 0 }, { x: -1800, duration: D, ease: "none" }, 0);

      streaks.forEach((s, i) => {
        tl.fromTo(s, { x: 0, opacity: 0 }, { x: -1800, opacity: 1, duration: 0.9 + rand() * 0.5, ease: "power1.in" }, (i * 0.35) % 9.1);
      });
      leaves.forEach((l, i) => {
        tl.fromTo(l, { x: 0, y: 0, rotation: 0 },
          { x: -1350, y: -250 + rand() * 500, rotation: -900, duration: 1.2 + rand() * 0.6, ease: "sine.inOut" }, (i * 0.47) % 8.6);
      });
      // Sprühregen nur bis zum Umschwung
      drops.forEach((d, i) => {
        tl.fromTo(d, { x: 0, y: 0, rotation: 35, opacity: 0.8 }, { x: -700, y: 2100, opacity: 0.8, duration: 0.9, ease: "none" }, (i * 0.071) % (TURN - 0.9));
      });

      // Umschwung: Licht bricht durch, Wolken verschwinden
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.85, duration: 0.15, ease: "power2.in" }, TURN - 0.15);
      tl.to("#flash", { opacity: 0, duration: 0.6, ease: "power2.out" }, TURN);
      tl.set("#clear", { opacity: 1 }, TURN);
      tl.to(".cloud", { opacity: 0, duration: 0.8 }, TURN);
      tl.set("#lake", { background: "linear-gradient(180deg, #7fb6d9, #2f6f9e)" }, TURN);
      tl.set("#ridge path", { attr: { fill: "#4c6f8f" } }, TURN);
      tl.fromTo("#rays", { rotation: 0 }, { rotation: 25, duration: D - TURN, ease: "none" }, TURN);
      tl.fromTo("#sun", { scale: 0.6 }, { scale: 1, duration: 1.2, ease: "back.out(1.6)" }, TURN);
      tl.fromTo("#me", { filter: "grayscale(0.7) brightness(0.8)" }, { filter: "grayscale(0) brightness(1.05) drop-shadow(0 0 40px rgba(255,230,160,0.8))", duration: 0.6 }, TURN);

      // ich stehe ruhig, nur die Kamera fährt langsam heran
      tl.fromTo("#me", { scale: 1 }, { scale: 1.06, duration: D, ease: "sine.inOut" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
