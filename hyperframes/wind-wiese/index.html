<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #5fb0f0; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      /* Wind auf der Wiese: Wolken jagen, Gras wogt, Blätter fliegen */
      #sky { background: linear-gradient(180deg, #2f86d9 0%, #6fb7f2 45%, #d6efff 75%); }
      .cloud { position: absolute; }
      .cloud i { position: absolute; border-radius: 50%; background: #ffffff; }
      .hill { position: absolute; left: 0; width: 4320px; }
      #hillFar { top: 1000px; height: 300px; }
      #hillNear { top: 1150px; height: 300px; }
      #meadow { position: absolute; left: 0; right: 0; top: 1360px; bottom: 0; background: linear-gradient(180deg, #5ea83a, #3d7f26); }
      .blade { position: absolute; bottom: 0; width: 10px; border-radius: 10px 10px 0 0; transform-origin: 50% 100%; }
      .flower { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 6px #ffd84d inset; }
      .streak {
        position: absolute; height: 6px; border-radius: 6px;
        background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.85), rgba(255,255,255,0));
      }
      .leaf { position: absolute; width: 34px; height: 18px; border-radius: 0 100% 0 100%; }
      #me {
        position: absolute; left: 50%; bottom: -30px; width: 900px; height: 980px; margin-left: -450px;
        background: url("assets/ich.png") center bottom / contain no-repeat;
        transform-origin: 50% 100%;
        filter: drop-shadow(0 10px 40px rgba(0,40,80,0.35));
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="sky" class="clip layer" data-start="0" data-duration="10" data-track-index="0"></div>
      <div id="land" class="clip layer" data-start="0" data-duration="10" data-track-index="1"></div>
      <div id="me" class="clip" data-start="0" data-duration="10" data-track-index="2"></div>
      <div id="wind" class="clip layer" data-start="0" data-duration="10" data-track-index="3"></div>
    </div>
    <script>
      let seed = 4242;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      // Wolken aus Kreisen
      const sky = document.getElementById("sky");
      const clouds = [];
      for (let i = 0; i < 7; i++) {
        const c = document.createElement("div");
        c.className = "cloud";
        c.style.left = rand() * 1300 + "px";
        c.style.top = 120 + rand() * 760 + "px";
        const s = 0.6 + rand() * 0.8;
        c.style.transform = `scale(${s})`;
        c.innerHTML = '<i style="left:0;top:40px;width:160px;height:100px"></i><i style="left:70px;top:0;width:150px;height:140px"></i><i style="left:170px;top:30px;width:150px;height:110px"></i><i style="left:40px;top:70px;width:250px;height:80px"></i>';
        c.style.opacity = 0.75 + rand() * 0.25;
        sky.appendChild(c);
        clouds.push([c, 0.6 + s]);
      }

      // Hügel als SVG
      const hills = (id, color, step, amp) => {
        let d = "M0 300";
        for (let x = 0; x <= 4320; x += step) d += ` Q${x + step / 2} ${20 + rand() * amp} ${x + step} ${90 + rand() * 60}`;
        return `<svg class="hill" id="${id}" viewBox="0 0 4320 300" preserveAspectRatio="none"><path d="${d} L4320 300 Z" fill="${color}"/></svg>`;
      };
      const land = document.getElementById("land");
      land.innerHTML = hills("hillFar", "#8cc66a", 540, 80) + hills("hillNear", "#6db04a", 360, 100) + '<div id="meadow"></div>';

      // Grashalme und Blumen (vorne)
      const blades = [];
      const meadow = document.getElementById("meadow");
      const greens = ["#7cc24a", "#5aa33a", "#9ad45e", "#4b8f2e"];
      for (let i = 0; i < 160; i++) {
        const b = document.createElement("div");
        b.className = "blade";
        b.style.left = rand() * 1080 + "px";
        b.style.height = 80 + rand() * 220 + "px";
        b.style.background = greens[i % 4];
        b.style.bottom = rand() * 420 + "px";
        meadow.appendChild(b);
        blades.push(b);
      }
      for (let i = 0; i < 26; i++) {
        const f = document.createElement("div");
        f.className = "flower";
        f.style.left = rand() * 1060 + "px";
        f.style.top = 40 + rand() * 480 + "px";
        meadow.appendChild(f);
      }

      // Windlinien und Blätter (vor mir, damit man den Wind spürt)
      const wind = document.getElementById("wind");
      const streaks = [], leaves = [];
      for (let i = 0; i < 22; i++) {
        const s = document.createElement("div");
        s.className = "streak";
        s.style.top = 80 + rand() * 1700 + "px";
        s.style.width = 200 + rand() * 360 + "px";
        s.style.left = "1100px";
        wind.appendChild(s);
        streaks.push(s);
      }
      const leafColors = ["#f2a12b", "#e5672a", "#c9d84b", "#8cc63f"];
      for (let i = 0; i < 26; i++) {
        const l = document.createElement("div");
        l.className = "leaf";
        l.style.background = leafColors[i % 4];
        l.style.top = 200 + rand() * 1500 + "px";
        l.style.left = "1120px";
        wind.appendChild(l);
        leaves.push(l);
      }

      const D = 10;
      const tl = gsap.timeline({ paused: true });

      clouds.forEach(([c, speed]) => tl.fromTo(c, { x: 0 }, { x: -900 * speed, duration: D, ease: "none" }, 0));
      tl.fromTo("#hillFar", { x: 0 }, { x: -380, duration: D, ease: "none" }, 0);
      tl.fromTo("#hillNear", { x: 0 }, { x: -760, duration: D, ease: "none" }, 0);

      // Gras wogt in Böen von rechts nach links
      blades.forEach((b, i) => {
        tl.fromTo(b, { rotation: -6 }, { rotation: -26, duration: 0.7, yoyo: true, repeat: 13, ease: "sine.inOut" },
          ((1080 - parseFloat(b.style.left)) / 1080) * 0.5 + (i % 3) * 0.05);
      });

      // Böen: Windlinien und Blätter fliegen quer durchs Bild
      streaks.forEach((s, i) => {
        tl.fromTo(s, { x: 0, opacity: 0 }, { x: -1700, opacity: 1, duration: 1.1 + rand() * 0.6, ease: "power1.in" }, (i * 0.43) % 9);
      });
      leaves.forEach((l, i) => {
        const t = (i * 0.37) % 8.6;
        tl.fromTo(l, { x: 0, y: 0, rotation: 0 },
          { x: -1350, y: -200 + rand() * 400, rotation: -720 + rand() * 360, duration: 1.4 + rand() * 0.8, ease: "sine.inOut" }, t);
      });

      // Ich laufe gegen den Wind: Wippen, leicht nach vorn gelehnt
      tl.fromTo("#me", { y: 0 }, { y: -18, duration: 0.25, yoyo: true, repeat: 39, ease: "sine.inOut" }, 0);
      tl.fromTo("#me", { rotation: 1.5 }, { rotation: 3.2, duration: 0.5, yoyo: true, repeat: 19, ease: "sine.inOut" }, 0);
      tl.fromTo("#me", { scale: 1 }, { scale: 1.05, duration: D, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
