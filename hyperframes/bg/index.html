<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      :root {
        --ground-top: #1a0b3d;
        --ground-bottom: #050214;
        --gold: #ffd54a;
        --pink: #ff3d8b;
        --cyan: #3de0ff;
        --ink: #ffffff;
        --font-display: "Arial Black", "Helvetica Neue", Arial, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden;
        background: var(--ground-bottom);
      }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: radial-gradient(ellipse at 50% 45%, #3a1580 0%, var(--ground-top) 45%, var(--ground-bottom) 100%);
        font-family: var(--font-display);
      }
      .layer { position: absolute; inset: 0; }
      /* light rays behind the head */
      #rays {
        position: absolute; left: 50%; top: 47%; width: 2600px; height: 2600px;
        margin: -1300px 0 0 -1300px; opacity: 0;
        background: repeating-conic-gradient(from 0deg, rgba(255,213,74,0.16) 0deg 7deg, transparent 7deg 22.5deg);
        -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%);
                mask-image: radial-gradient(circle, #000 0%, transparent 62%);
      }
      .ring {
        position: absolute; left: 50%; top: 47%; border-radius: 50%;
        width: 500px; height: 500px; margin: -250px 0 0 -250px;
        border: 6px solid var(--gold); opacity: 0;
      }
      #counter-wrap {
        position: absolute; left: 0; right: 0; top: 150px; text-align: center;
      }
      #date {
        color: var(--cyan); font-size: 64px; letter-spacing: 0.12em;
        text-shadow: 0 0 30px rgba(61,224,255,0.7);
      }
      #counter {
        color: var(--gold); font-size: 260px; line-height: 1; letter-spacing: -0.02em;
        text-shadow: 0 10px 0 #b8860b, 0 0 60px rgba(255,213,74,0.6);
      }
      #label {
        color: var(--ink); font-size: 58px; letter-spacing: 0.25em; margin-top: 10px;
      }
      .confetti { position: absolute; top: -80px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="bg" class="clip layer" data-start="0" data-duration="6" data-track-index="0">
        <div id="rays"></div>
        <div class="ring" id="ring1"></div>
        <div class="ring" id="ring2"></div>
        <div class="ring" id="ring3"></div>
      </div>
      <div id="confetti" class="clip layer" data-start="0" data-duration="6" data-track-index="1"></div>
      <div id="counter-wrap" class="clip" data-start="0" data-duration="6" data-track-index="2">
        <div id="date">11.11.</div>
        <div id="counter">0</div>
        <div id="label">FOLLOWER</div>
      </div>
    </div>
    <script>
      // Deterministic PRNG so every render is identical
      let seed = 1111;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      const colors = ["#ffd54a", "#ff3d8b", "#3de0ff", "#ffffff", "#9b5cff"];
      const confettiLayer = document.getElementById("confetti");
      const pieces = [];
      for (let i = 0; i < 90; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        const w = 14 + rand() * 18;
        el.style.width = w + "px";
        el.style.height = w * (0.4 + rand() * 0.6) + "px";
        el.style.left = rand() * 1080 + "px";
        el.style.background = colors[i % colors.length];
        confettiLayer.appendChild(el);
        pieces.push({ el, delay: 1.2 + rand() * 3.2, fall: 2.2 + rand() * 1.8, drift: (rand() - 0.5) * 300, spin: (rand() - 0.5) * 1440 });
      }

      const tl = gsap.timeline({ paused: true });

      // rays fade in and slowly rotate the whole film
      tl.to("#rays", { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.1);
      tl.fromTo("#rays", { rotation: 0 }, { rotation: 60, duration: 6, ease: "none" }, 0);

      // pulsing rings around the head position
      ["#ring1", "#ring2", "#ring3"].forEach((id, i) => {
        tl.fromTo(id,
          { scale: 1, opacity: 0.9 },
          { scale: 3, opacity: 0, duration: 2, ease: "power1.out", repeat: 1 },
          0.6 + i * 0.66);
      });

      // counter: drop in, then count up to 1111
      tl.from("#date", { y: -80, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 0.1);
      tl.from("#counter", { scale: 0.3, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 0.2);
      tl.from("#label", { y: 40, opacity: 0, duration: 0.4, ease: "power3.out" }, 0.45);
      const count = { v: 0 };
      tl.to(count, {
        v: 1111, duration: 2.0, ease: "power2.inOut",
        onUpdate: () => { document.getElementById("counter").textContent = Math.round(count.v); }
      }, 0.4);
      tl.to("#counter", { scale: 1.18, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, 2.4);

      // confetti burst after the counter hits 1111
      pieces.forEach((p) => {
        tl.fromTo(p.el, { y: 0, x: 0, rotation: 0 },
          { y: 2100, x: p.drift, rotation: p.spin, duration: p.fall, ease: "power1.in" }, p.delay);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
