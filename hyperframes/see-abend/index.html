<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #2a1650; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      /* Abend am See: goldene Stunde, Sonne sinkt, Segelboote */
      #sky { background: linear-gradient(180deg, #2a1650 0%, #7b2f7f 28%, #e0566b 48%, #ff9a4d 60%, #ffd27a 68%); }
      #sun {
        position: absolute; left: 540px; top: 760px; width: 300px; height: 300px; margin-left: -150px; border-radius: 50%;
        background: radial-gradient(circle, #fff6d0 0%, #ffd27a 50%, #ff8a3d 100%);
        box-shadow: 0 0 160px 80px rgba(255,160,80,0.6);
      }
      .cloud { position: absolute; height: 34px; border-radius: 34px; background: rgba(255,170,150,0.55); filter: blur(8px); }
      #hills { position: absolute; left: 0; top: 1010px; width: 4320px; height: 180px; }
      #lake {
        position: absolute; left: 0; right: 0; top: 1150px; bottom: 0;
        background: linear-gradient(180deg, #ff9a5a 0%, #b5517a 35%, #3a2466 100%);
      }
      .path { position: absolute; left: 540px; height: 8px; border-radius: 8px; background: #ffe7a0; opacity: 0.8; }
      .boat { position: absolute; width: 120px; height: 150px; }
      .bird { position: absolute; width: 46px; height: 16px; }
      .bird::before, .bird::after {
        content: ""; position: absolute; top: 0; width: 24px; height: 12px;
        border-top: 4px solid #2a1650; border-radius: 50% 50% 0 0;
      }
      .bird::before { left: 0; } .bird::after { right: 0; }
      #pier { position: absolute; left: 0; bottom: 0; width: 4320px; height: 520px; }
      #me {
        position: absolute; left: 50%; bottom: -30px; width: 900px; height: 980px; margin-left: -450px;
        background: url("assets/ich.png") center bottom / contain no-repeat;
        transform-origin: 50% 100%;
        filter: sepia(0.25) saturate(1.2) drop-shadow(0 0 40px rgba(255,170,90,0.75));
      }
      #warm { background: linear-gradient(180deg, rgba(255,140,60,0) 40%, rgba(255,120,60,0.25) 100%); mix-blend-mode: soft-light; }
      .spark { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: #fff3c0; box-shadow: 0 0 16px 5px rgba(255,220,140,0.85); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <div id="sky" class="clip layer" data-start="0" data-duration="10" data-track-index="0"></div>
      <div id="water" class="clip layer" data-start="0" data-duration="10" data-track-index="1"></div>
      <div id="me" class="clip" data-start="0" data-duration="10" data-track-index="2"></div>
      <div id="warm" class="clip layer" data-start="0" data-duration="10" data-track-index="3"></div>
      <div id="fx" class="clip layer" data-start="0" data-duration="10" data-track-index="4"></div>
    </div>
    <script>
      let seed = 1907;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

      const sky = document.getElementById("sky");
      sky.innerHTML = '<div id="sun"></div>' +
        [[80, 380, 340], [620, 300, 420], [300, 520, 260], [760, 600, 220]].map(([x, y, w]) =>
          `<div class="cloud" style="left:${x}px;top:${y}px;width:${w}px"></div>`).join("") +
        [0, 1, 2].map((i) => `<div class="bird" style="left:${700 + i * 64}px;top:${250 + (i % 2) * 36}px"></div>`).join("");
      // flache Hügel am anderen Ufer, breit genug zum Vorbeiziehen
      let hill = "M0 180";
      for (let x = 0; x <= 4320; x += 180) hill += ` Q${x + 90} ${40 + rand() * 80} ${x + 180} ${110 + rand() * 50}`;
      sky.insertAdjacentHTML("beforeend",
        `<svg id="hills" viewBox="0 0 4320 180" preserveAspectRatio="none"><path d="${hill} L4320 180 Z" fill="#4a2156"/></svg>`);

      const water = document.getElementById("water");
      water.innerHTML = '<div id="lake"></div>';
      // goldener Sonnenpfad auf dem Wasser
      const paths = [];
      for (let i = 0; i < 26; i++) {
        const p = document.createElement("div");
        p.className = "path";
        const y = 1165 + i * 28;
        const w = 60 + i * 14 + rand() * 80;
        p.style.top = y + "px";
        p.style.width = w + "px";
        p.style.marginLeft = -w / 2 + (rand() - 0.5) * 40 + "px";
        water.appendChild(p);
        paths.push(p);
      }
      const sail = (c) => `<svg viewBox="0 0 120 150"><path d="M60 10 L60 115 L15 115 Z" fill="${c}"/><path d="M64 25 L64 115 L100 115 Z" fill="${c}" opacity="0.8"/><path d="M5 120 L115 120 L95 140 L25 140 Z" fill="#2a1650"/></svg>`;
      water.insertAdjacentHTML("beforeend",
        `<div class="boat" id="boat1" style="left:120px;top:1060px">${sail("#3a1d5a")}</div>` +
        `<div class="boat" id="boat2" style="left:820px;top:1100px;transform:scale(0.7)">${sail("#4a2766")}</div>`);
      // Holzsteg im Vordergrund mit Pfosten
      let posts = "";
      for (let x = 0; x < 4320; x += 240) posts += `<rect x="${x}" y="300" width="30" height="220" fill="#2b1530"/><rect x="${x - 6}" y="292" width="42" height="14" rx="4" fill="#3b1f3e"/>`;
      water.insertAdjacentHTML("beforeend",
        `<svg id="pier" viewBox="0 0 4320 520"><rect x="0" y="420" width="4320" height="100" fill="#2b1530"/>${posts}<rect x="0" y="330" width="4320" height="16" fill="#3b1f3e"/></svg>`);

      const fx = document.getElementById("fx");
      const sparks = [];
      for (let i = 0; i < 36; i++) {
        const s = document.createElement("div");
        s.className = "spark";
        s.style.left = rand() * 1060 + "px";
        s.style.top = 1180 + rand() * 700 + "px";
        fx.appendChild(s);
        sparks.push(s);
      }

      const D = 10;
      const tl = gsap.timeline({ paused: true });

      // Sonne sinkt langsam ins Wasser
      tl.fromTo("#sun", { y: 0 }, { y: 190, duration: D, ease: "sine.in" }, 0);
      tl.fromTo(".cloud", { x: 0 }, { x: -120, duration: D, ease: "none" }, 0);
      tl.fromTo(".bird", { x: 0, y: 0 }, { x: -620, y: 80, duration: D, ease: "none" }, 0);
      tl.fromTo(".bird", { scaleY: 1 }, { scaleY: 0.4, duration: 0.3, yoyo: true, repeat: 33, ease: "sine.inOut" }, 0);

      // Spaziergang auf dem Steg: Parallaxe
      tl.fromTo("#hills", { x: 0 }, { x: -300, duration: D, ease: "none" }, 0);
      tl.fromTo("#boat1", { x: 0 }, { x: -60, duration: D, ease: "none" }, 0);
      tl.fromTo("#boat1", { rotation: -3 }, { rotation: 3, duration: 1.25, yoyo: true, repeat: 7, ease: "sine.inOut" }, 0);
      tl.fromTo("#boat2", { x: 0, rotation: 2 }, { x: -140, rotation: -2, duration: D, ease: "sine.inOut" }, 0);
      tl.fromTo("#pier", { x: 0 }, { x: -1920, duration: D, ease: "none" }, 0);
      paths.forEach((p, i) => {
        tl.fromTo(p, { scaleX: 0.7, opacity: 0.5 }, { scaleX: 1.15, opacity: 0.95, duration: 0.6 + (i % 4) * 0.15, yoyo: true, repeat: 7, ease: "sine.inOut" }, (i * 0.11) % 0.9);
      });
      sparks.forEach((s, i) => {
        tl.fromTo(s, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1.2, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, (i * 0.27) % 9.3);
      });

      // Schritte
      tl.fromTo("#me", { y: 0 }, { y: -14, duration: 0.28, yoyo: true, repeat: 35, ease: "sine.inOut" }, 0);
      tl.fromTo("#me", { rotation: 1 }, { rotation: -1, duration: 0.56, yoyo: true, repeat: 17, ease: "sine.inOut" }, 0);
      tl.fromTo("#me", { scale: 1.04 }, { scale: 1, duration: D, ease: "none" }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
