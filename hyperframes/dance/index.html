<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #12002b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      #sky { background: linear-gradient(180deg, #2b0a5e 0%, #7a1fa2 45%, #ff3d8b 100%); }
      #sky2 { background: linear-gradient(180deg, #003a63 0%, #00a0c8 50%, #ffcf5a 100%); opacity: 0; }
      .beam {
        position: absolute; left: 50%; bottom: -200px; width: 260px; height: 2600px; margin-left: -130px;
        transform-origin: 50% 100%; mix-blend-mode: screen; opacity: 0.55;
      }
      #b1 { background: linear-gradient(0deg, rgba(61,224,255,0.9), transparent 80%); }
      #b2 { background: linear-gradient(0deg, rgba(255,213,74,0.9), transparent 80%); }
      #b3 { background: linear-gradient(0deg, rgba(255,111,176,0.9), transparent 80%); }
      #b4 { background: linear-gradient(0deg, rgba(155,92,255,0.9), transparent 80%); }
      #floor {
        position: absolute; left: -200px; right: -200px; bottom: 0; height: 520px;
        background:
          repeating-linear-gradient(90deg, rgba(255,255,255,0.18) 0 4px, transparent 4px 180px),
          repeating-linear-gradient(0deg, rgba(255,255,255,0.18) 0 4px, transparent 4px 90px);
        transform: perspective(600px) rotateX(55deg); transform-origin: 50% 100%;
      }
      #glow {
        position: absolute; left: 50%; top: 55%; width: 1300px; height: 1300px; margin: -650px 0 0 -650px;
        border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,0.5), transparent 60%);
      }
      #dancer {
        position: absolute; left: 50%; bottom: -230px; width: 1260px; height: 1372px; margin-left: -630px;
        background: url("assets/ich.png") center bottom / contain no-repeat;
        transform-origin: 50% 100%;
        filter: drop-shadow(0 0 30px rgba(255,255,255,0.45));
      }
      #flash { background: #fff; opacity: 0; }
      .spark { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 0 20px 6px rgba(255,255,255,0.8); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="6" data-width="1080" data-height="1920">
      <div id="sky" class="clip layer" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="sky2" class="clip layer" data-start="0" data-duration="6" data-track-index="1"></div>
      <div id="lights" class="clip layer" data-start="0" data-duration="6" data-track-index="2"></div>
      <div id="dancer" class="clip" data-start="0" data-duration="6" data-track-index="3"></div>
      <div id="flash" class="clip layer" data-start="0" data-duration="6" data-track-index="4"></div>
    </div>
    <script>
      // Lichter, Boden und Funken aufbauen (deterministisch)
      const lights = document.getElementById("lights");
      lights.innerHTML = '<div id="glow"></div><div id="floor"></div>' +
        ["b1", "b2", "b3", "b4"].map((id) => `<div class="beam" id="${id}"></div>`).join("");
      let seed = 1111;
      const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
      const sparks = [];
      for (let i = 0; i < 40; i++) {
        const s = document.createElement("div");
        s.className = "spark";
        s.style.left = rand() * 1040 + "px";
        s.style.top = 80 + rand() * 1200 + "px";
        lights.appendChild(s);
        sparks.push(s);
      }

      const BEAT = 0.5; // 120 BPM
      const tl = gsap.timeline({ paused: true });

      // Hintergrund wechselt nach 2 Takten die Stimmung
      tl.to("#sky2", { opacity: 1, duration: 0.25 }, 4 * BEAT * 2 - 0.1);

      // Scheinwerfer schwenken
      [["#b1", -35, 30], ["#b2", 30, -30], ["#b3", -15, 40], ["#b4", 45, -20]].forEach(([id, a, b], i) => {
        tl.fromTo(id, { rotation: a }, { rotation: b, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 5 }, i * 0.12);
      });

      // Tanz: pro Schlag ein Move, Drehpunkt unten in der Mitte
      const moves = [
        { x: -40, rotation: -6 }, { x: 40, rotation: 6 }, { x: -40, rotation: -6 }, { x: 40, rotation: 6 },
        { y: -90, rotation: 0, x: 0 }, { y: 0 }, { y: -90 }, { y: 0 },
        { x: -45, rotation: -8 }, { x: 45, rotation: 8 }, { x: 0, rotation: 0, scaleX: -1 }, { scaleX: 1 },
      ];
      for (let i = 0; i < 12; i++) {
        const t = i * BEAT;
        const m = moves[i];
        // Squash auf dem Schlag, dann in den Move federn
        tl.to("#dancer", { scaleY: 0.93, scaleX: m.scaleX !== undefined ? m.scaleX * 1.04 : undefined, duration: 0.08, ease: "power2.out" }, t);
        const target = Object.assign({ scaleY: 1, y: 0 }, m);
        if (m.scaleX === undefined) delete target.scaleX;
        tl.to("#dancer", Object.assign(target, { duration: BEAT - 0.08, ease: m.y ? "power2.out" : "back.out(2)" }), t + 0.08);
        // Lichtpuls auf jedem Schlag
        tl.fromTo("#glow", { scale: 1.15, opacity: 1 }, { scale: 0.9, opacity: 0.5, duration: BEAT, ease: "power2.out" }, t);
        if (i % 4 === 0) tl.fromTo("#flash", { opacity: 0.35 }, { opacity: 0, duration: 0.25, ease: "power2.out" }, t);
      }

      sparks.forEach((s, i) => {
        tl.fromTo(s, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.2, duration: 0.15, yoyo: true, repeat: 1, ease: "power1.out" }, (i * 0.37) % 5.8);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
