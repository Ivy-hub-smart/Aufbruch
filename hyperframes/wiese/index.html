<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #9ad8ff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .layer { position: absolute; inset: 0; }
      /* Frühlingswiese für den Hoppelhasen: Himmel, Sonne, Wolken, Hügel, Gras, Blumen */
      #himmel { background: linear-gradient(180deg, #6ec6ff 0%, #a9e0ff 45%, #e8f8ff 70%); }
      #sonne { position: absolute; left: 760px; top: 170px; width: 220px; height: 220px; border-radius: 50%;
        background: radial-gradient(circle, #fff7c2 0%, #ffe066 55%, #ffc93c 100%); box-shadow: 0 0 120px 40px rgba(255,224,102,0.55); }
      #strahlen { position: absolute; left: 570px; top: -20px; width: 600px; height: 600px; opacity: 0.45; }
      .wolke { position: absolute; }
      #huegel { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      .halm { position: absolute; bottom: 0; width: 14px; border-radius: 50% 50% 0 0; transform-origin: 50% 100%; }
      .blume { position: absolute; transform-origin: 50% 100%; }
      #falter { display: block; width: 70px; height: 50px; }
      .fluegel { transform-origin: 35px 25px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">
      <div id="himmel" class="clip layer" data-start="0" data-duration="8" data-track-index="0"></div>
      <div id="sonnen-ebene" class="clip layer" data-start="0" data-duration="8" data-track-index="1">
        <svg id="strahlen" viewBox="-300 -300 600 600"></svg>
        <div id="sonne"></div>
      </div>
      <div id="wolken" class="clip layer" data-start="0" data-duration="8" data-track-index="2"></div>
      <div id="landschaft" class="clip layer" data-start="0" data-duration="8" data-track-index="3">
        <svg id="huegel" viewBox="0 0 1080 1920">
          <path d="M0 1180 C 200 1080, 380 1090, 560 1160 S 900 1080, 1080 1140 L 1080 1920 L 0 1920 Z" fill="#a6d97c"/>
          <path d="M0 1300 C 260 1220, 520 1240, 700 1290 S 980 1240, 1080 1270 L 1080 1920 L 0 1920 Z" fill="#7cc458"/>
          <path d="M0 1400 C 300 1360, 700 1370, 1080 1390 L 1080 1920 L 0 1920 Z" fill="#5fae3f"/>
          <ellipse cx="540" cy="1660" rx="540" ry="220" fill="#57a239" opacity="0.6"/>
        </svg>
      </div>
      <div id="gras" class="clip layer" data-start="0" data-duration="8" data-track-index="4"></div>
      <div id="blumen" class="clip layer" data-start="0" data-duration="8" data-track-index="5"></div>
      <div id="schmetterling" class="clip layer" data-start="0" data-duration="8" data-track-index="6">
        <div id="falter-weg" style="position:absolute;left:0;top:0"><svg id="falter" viewBox="0 0 70 50">
          <g class="fluegel" id="fl"><ellipse cx="20" cy="18" rx="17" ry="14" fill="#ff8fc7"/><ellipse cx="22" cy="36" rx="11" ry="9" fill="#ffb3d9"/></g>
          <g class="fluegel" id="fr"><ellipse cx="50" cy="18" rx="17" ry="14" fill="#ff8fc7"/><ellipse cx="48" cy="36" rx="11" ry="9" fill="#ffb3d9"/></g>
          <rect x="32" y="10" width="6" height="32" rx="3" fill="#5a3b2a"/>
        </svg></div>
      </div>
    </div>
    <script>
      const D = 8;
      // fester Zufall (immer gleich, damit jedes Rendern identisch ist)
      let s = 11;
      const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);

      // Sonnenstrahlen
      let strahlen = "";
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2, b = a + 0.09;
        strahlen += `<path d="M0 0 L ${Math.cos(a) * 300} ${Math.sin(a) * 300} L ${Math.cos(b) * 300} ${Math.sin(b) * 300} Z" fill="#fff3a6"/>`;
      }
      document.getElementById("strahlen").innerHTML = strahlen;

      // Wolken aus weichen Kreisen
      const wolke = (id, x, y, k) => `
        <svg id="${id}" class="wolke" style="left:${x}px;top:${y}px;width:${340 * k}px;height:${150 * k}px" viewBox="0 0 340 150">
          <g fill="#ffffff"><ellipse cx="170" cy="100" rx="160" ry="45"/><circle cx="110" cy="80" r="55"/><circle cx="190" cy="60" r="65"/><circle cx="260" cy="90" r="45"/></g>
        </svg>`;
      document.getElementById("wolken").innerHTML =
        wolke("w1", 60, 260, 1) + wolke("w2", 520, 520, 0.7) + wolke("w3", -120, 760, 0.85);

      // Grashalme am vorderen Rand
      let gras = "";
      for (let i = 0; i < 90; i++) {
        const h = 90 + rnd() * 120, x = i * 12.2 - 10 + rnd() * 8;
        const farbe = ["#4c9a2f", "#5fb33d", "#3f8a27", "#6cc24a"][i % 4];
        gras += `<div class="halm" style="left:${x}px;height:${h}px;background:${farbe}"></div>`;
      }
      document.getElementById("gras").innerHTML = gras;

      // Blumen in der Wiese
      const farben = ["#ffffff", "#ffd43b", "#ff8fc7", "#b197fc", "#ff6b6b"];
      let blumen = "";
      for (let i = 0; i < 26; i++) {
        const x = 30 + rnd() * 1000, y = 1330 + rnd() * 520, k = 0.6 + (y - 1330) / 520 * 0.8;
        const f = farben[i % farben.length];
        let blatt = "";
        for (let j = 0; j < 5; j++) {
          const a = (j / 5) * Math.PI * 2;
          blatt += `<circle cx="${20 + Math.cos(a) * 11}" cy="${20 + Math.sin(a) * 11}" r="9" fill="${f}"/>`;
        }
        blumen += `<svg class="blume" style="left:${x}px;top:${y - 60 * k}px;width:${40 * k}px;height:${80 * k}px" viewBox="0 0 40 80">
          <rect x="18.5" y="28" width="3" height="52" fill="#3f8a27"/>${blatt}<circle cx="20" cy="20" r="7" fill="#ffb703"/></svg>`;
      }
      document.getElementById("blumen").innerHTML = blumen;

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#strahlen", { rotation: 0 }, { rotation: 40, duration: D, ease: "none" }, 0);
      tl.fromTo("#sonne", { scale: 1 }, { scale: 1.06, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 7 }, 0);
      tl.fromTo("#w1", { x: 0 }, { x: 90, duration: D, ease: "none" }, 0);
      tl.fromTo("#w2", { x: 0 }, { x: -70, duration: D, ease: "none" }, 0);
      tl.fromTo("#w3", { x: 0 }, { x: 120, duration: D, ease: "none" }, 0);
      // Gras und Blumen wiegen sich im Wind
      document.querySelectorAll(".halm").forEach((el, i) => {
        tl.fromTo(el, { rotation: -6 }, { rotation: 6, duration: 1, ease: "sine.inOut", yoyo: true, repeat: 7 }, (i % 7) * -0.14);
      });
      document.querySelectorAll(".blume").forEach((el, i) => {
        tl.fromTo(el, { rotation: -5 }, { rotation: 5, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 5 }, 0);
      });
      // Schmetterling flattert quer übers Bild
      tl.fromTo("#falter-weg", { x: -80, y: 980 }, { x: 1120, y: 880, duration: D, ease: "none" }, 0);
      tl.fromTo("#falter", { y: 0 }, { y: -70, duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 15 }, 0);
      tl.fromTo("#fl", { scaleX: 1 }, { scaleX: 0.3, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 79 }, 0);
      tl.fromTo("#fr", { scaleX: 1 }, { scaleX: 0.3, duration: 0.1, ease: "sine.inOut", yoyo: true, repeat: 79 }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
