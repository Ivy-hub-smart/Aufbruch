<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Kaushan+Script&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1c3a5e; --cream: #f3e3c8; --ink: #22324a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: Montserrat, sans-serif; color: var(--navy); }
  .slide { position: relative; width: 1080px; height: 1080px; overflow: hidden; }
  .bg { position: absolute; inset: -80px; background: url(assets/cover.png) var(--pos, 70% 30%) / var(--zoom, 180%) no-repeat; filter: blur(26px) saturate(1.1); }
  .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,252,246,.88) 0%, rgba(255,250,242,.80) 55%, rgba(255,248,238,.92) 100%); }
  .count { position: absolute; top: 58px; right: 64px; width: 110px; height: 66px; display: grid; place-items: center; color: #fff; font-size: 30px; font-weight: 400; }
  .count svg { position: absolute; inset: 0; }
  .count span { position: relative; }
  .content { position: absolute; inset: 120px 90px 190px 90px; display: flex; flex-direction: column; justify-content: center; gap: 46px; }
  .reason { position: relative; }
  .num { font-family: 'Kaushan Script', cursive; font-size: 120px; line-height: .8; color: var(--navy); position: absolute; left: 0; top: 0; }
  .num::after { content: ''; position: absolute; left: -14px; bottom: 6px; width: 110px; height: 34px; background: var(--cream); z-index: -1; border-radius: 40% 60% 50% 40%; transform: rotate(-4deg); }
  .rtext { margin-left: 130px; }
  .title { font-family: 'Kaushan Script', cursive; font-size: 62px; line-height: 1.1; color: var(--navy); margin-bottom: 14px; }
  .body { font-size: 33px; line-height: 1.38; font-weight: 400; color: var(--ink); }
  .body b { font-weight: 700; color: var(--navy); }
  .brush { position: relative; display: inline-block; padding: 22px 40px; font-family: Caveat, cursive; font-size: 46px; font-weight: 700; color: var(--ink); transform: rotate(-3deg); align-self: flex-start; }
  .brush svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .brush { isolation: isolate; }
  .logo { position: absolute; left: 0; right: 0; bottom: 56px; text-align: center; color: var(--navy); }
  .logo .name { font-size: 40px; font-weight: 400; letter-spacing: .5px; }
  .logo .tag { font-size: 17px; letter-spacing: 3px; margin-top: 4px; }
  .swipe { position: absolute; right: 70px; bottom: 80px; font-family: Caveat, cursive; font-size: 40px; color: var(--navy); }
  /* CTA */
  .cta .content { align-items: center; text-align: center; gap: 34px; }
  .cta .big { font-family: 'Kaushan Script', cursive; font-size: 78px; line-height: 1.15; }
  .cta .word { font-family: Montserrat; font-weight: 700; font-size: 92px; letter-spacing: 6px; color: #fff; position: relative; padding: 14px 54px; isolation: isolate; }
  .cta .word svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: -1; }
  .cta .body { font-size: 34px; max-width: 820px; }
  .icons { display: flex; gap: 46px; font-size: 26px; font-weight: 600; letter-spacing: 1px; }
  .icons div { display: flex; align-items: center; gap: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const brushNavy = `<svg viewBox="0 0 110 66" preserveAspectRatio="none"><path d="M8 14 C30 4 80 2 104 10 C110 24 108 44 100 58 C70 66 30 64 6 56 C0 40 2 26 8 14Z" fill="#2b5687"/></svg>`;
const brushCream = (fill) => `<svg viewBox="0 0 400 100" preserveAspectRatio="none"><path d="M6 22 C80 6 250 2 392 14 C398 40 396 66 386 88 C260 98 120 96 10 84 C2 62 0 42 6 22Z" fill="${fill}" opacity=".95"/><path d="M0 30 C60 24 120 22 180 26" stroke="${fill}" stroke-width="5" opacity=".5" fill="none"/><path d="M220 92 C300 90 360 88 400 84" stroke="${fill}" stroke-width="4" opacity=".5" fill="none"/></svg>`;
const logo = `<div class="logo"><svg width="110" height="44" viewBox="0 0 110 44"><path d="M10 18 C30 4 55 4 75 14 C88 20 98 18 104 12" stroke="#1c3a5e" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M6 32 C28 20 52 22 70 30 C84 36 96 34 106 26" stroke="#2b6aa8" stroke-width="5" fill="none" stroke-linecap="round"/></svg><div class="name">aufbruchsvision</div><div class="tag">Dein Weg. Deine Freiheit.</div></div>`;
const count = (n) => `<div class="count">${brushNavy}<span>${n}/5</span></div>`;
const reason = (n, title, body) => `<div class="reason"><div class="num">${n}</div><div class="rtext"><div class="title">${title}</div><div class="body">${body}</div></div></div>`;

const slides = {
  2: { pos: '78% 22%', html: `
    ${reason(1, 'Sicherheit', 'Ein einziges Einkommen ist ein <b>Klumpenrisiko</b>. Kündigung, Krankheit, Umstrukturierung – ein zweites Standbein fängt dich auf.')}
    ${reason(2, 'Mehr Wahlfreiheit', 'Wenn nicht jeder Franken vom Job abhängt, sagst du leichter <b>Nein</b> – zu Überstunden, zu Stress, zu allem, was dir nicht guttut.')}
  `, swipe: true },
  3: { pos: '20% 45%', html: `
    ${reason(3, 'Deine Träume bekommen ein Budget', 'Reisen, Weiterbildung, mehr Zeit mit der Familie – <b>Wünsche werden zu Plänen</b>, statt „irgendwann mal“.')}
    ${reason(4, 'Du wächst', 'Marketing, KI, Kommunikation: Du lernst Fähigkeiten, die dich <b>auch im Job</b> stärker machen.')}
  `, swipe: true },
  4: { pos: '60% 60%', html: `
    ${reason(5, 'Du baust etwas Eigenes', 'Kein Chef bestimmt dein Tempo. Du erschaffst etwas, das <b>dir gehört</b> – und wirst zum Vorbild für die Menschen um dich.')}
    <div class="brush">${brushCream('#f3e3c8')}Du musst nicht kündigen.<br>Du musst nur anfangen. ♡</div>
  `, swipe: true },
  5: { pos: '75% 35%', cta: true, html: `
    <div class="big">Bereit für deinen<br>Aufbruch?</div>
    <div class="body">Kommentiere</div>
    <div class="word">${brushCream('#2b5687')}FREIHEIT</div>
    <div class="body">und ich schicke dir meine <b>3 ersten Schritte</b> für dein zweites Einkommen – direkt per DM.</div>
    <div class="icons"><div>🔖 Speichern</div><div>📤 Teilen</div><div>➕ Folgen</div></div>
  ` },
};

const n = Number(new URLSearchParams(location.search).get('s') || 2);
const s = slides[n];
document.getElementById('root').innerHTML = `
  <div class="slide ${s.cta ? 'cta' : ''}" style="--pos:${s.pos}">
    <div class="bg"></div><div class="veil"></div>
    ${count(n)}
    <div class="content">${s.html}</div>
    ${s.swipe ? '<div class="swipe">weiter →</div>' : ''}
    ${logo}
  </div>`;
</script>
</body>
</html>
